_schema-version: "3.2"
ID: paltarumi-portalweb-registroprefactura
version: 0.0.1
description: Registro Pre Factura Contador (HTML5 app para SAP Build Work Zone)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install

modules:
  # 1) Destinations para que Work Zone encuentre la app en el HTML5 repo
  - name: registroprefactura-destination-content
    type: com.sap.application.content
    requires:
      - name: registroprefactura-destination-service
        parameters:
          content-target: true
      - name: registroprefactura-repo-host
        parameters:
          service-key:
            name: registroprefactura-repo-host-key
      - name: registroprefactura-uaa
        parameters:
          service-key:
            name: registroprefactura-uaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: registroprefactura_html_repo_host
              ServiceInstanceName: registroprefactura-html5-srv
              ServiceKeyName: registroprefactura-repo-host-key
              sap.cloud.service: paltarumi.portalweb.registroprefactura
            - Authentication: OAuth2UserTokenExchange
              Name: registroprefactura_uaa
              ServiceInstanceName: registroprefactura-xsuaa-srv
              ServiceKeyName: registroprefactura-uaa-key
              sap.cloud.service: paltarumi.portalweb.registroprefactura
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  # 2) Sube el zip de la app al HTML5 repo
  - name: registroprefactura-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: registroprefactura-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - paltarumiportalwebregistroprefactura.zip
          name: registroprefactura-app
          target-path: resources/

  # 3) La app (webapp/ -> dist/*.zip)
  - name: registroprefactura-app
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build:cf
      supported-platforms: []

resources:
  - name: registroprefactura-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
  - name: registroprefactura-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: registroprefactura-html5-srv
  - name: registroprefactura-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: registroprefactura-xsuaa-srv
      path: ./xs-security.json
